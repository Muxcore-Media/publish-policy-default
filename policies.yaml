# publish-policy-default — event publication policy
#
# Rules are evaluated in order. The first matching rule decides.
# Event types support glob matching: "download.*", "media.*", "*"

# Downloader can publish download-related events
- caller: "downloader-qbittorrent"
  event_types: ["download.*"]

# Transcoder can publish transcode-related events
- caller: "transcoder-ffmpeg"
  event_types: ["transcode.*"]

# Media managers can publish their lifecycle events
- caller: "media-movies"
  event_types: ["media.*"]
- caller: "media-tv"
  event_types: ["media.*"]

# Notification module can send alerts
- caller: "notifier-discord"
  event_types: ["notification.*", "alert.*"]

# Auth module can publish auth lifecycle events
- caller: "auth-local"
  event_types: ["auth.*"]

# Any module can publish module lifecycle events
- caller: "*"
  event_types: ["module.*", "cluster.*"]

# Catch-all for development (uncomment to allow everything)
# - caller: "*"
#   event_types: ["*"]
