# publish-policy-default — event publication policy
#
# Rules are evaluated in order. The first matching rule decides.
# Event types support glob matching: "download.*", "media.*", "*"

groups:
  downloaders:
    - downloader-qbittorrent
    - downloader-native-torrent
    - downloader-sabnzbd
    - downloader-native-usenet
    - downloader-debrid
  indexers:
    - indexer-prowlarr
    - indexer-torznab
    - indexer-piratebay
  media_managers:
    - media-movies
    - media-tvshows

rules:
  - caller_group: downloaders
    event_types: ["download.*"]

  - caller_group: indexers
    event_types: ["indexer.*", "module.*"]

  - caller_group: media_managers
    event_types: ["media.*"]

  - caller: "transcoder-ffmpeg"
    event_types: ["transcode.*"]

  - caller: "media-automation"
    event_types: ["download.*", "media.*"]

  - caller: "media-scanner"
    event_types: ["media.*"]

  - caller: "request-media"
    event_types: ["media.*"]

  - caller: "notification-default"
    event_types: ["notification.*", "alert.*"]

  - caller: "jellyfin"
    event_types: ["playback.*"]
  - caller: "emby"
    event_types: ["playback.*"]
  - caller: "plex"
    event_types: ["playback.*"]

  - caller: "playback-guard"
    event_types: ["playback.guard.violation"]

  - caller: "media-list-sync"
    event_types: ["importlist.synced"]

  - caller: "health-monitor"
    event_types: ["health.*"]

  - caller: "auth-local"
    event_types: ["auth.*"]

  - caller: "*"
    event_types: ["module.*", "cluster.*"]

# Catch-all for development (uncomment to allow everything)
# - caller: "*"
#   event_types: ["*"]
